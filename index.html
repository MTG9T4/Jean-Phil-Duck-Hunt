/* ---------- audio ---------- */
var actx = null, muted = false;
function AC(){
  if (!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if (actx && actx.state === 'suspended'){ actx.resume(); }
  return actx;
}
function beep(f0, f1, dur, type, vol, when){
  if (muted || !AC()) return;
  try{
    var t = actx.currentTime + (when || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
function bang(){
  if (muted || !AC()) return;
  try{
    var t = actx.currentTime, len = Math.floor(actx.sampleRate * 0.22);
    var buf = actx.createBuffer(1, len, actx.sampleRate);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
    var src = actx.createBufferSource(); src.buffer = buf;
    var f = actx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(3200, t);
    f.frequency.exponentialRampToValueAtTime(300, t + 0.2);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    src.connect(f); f.connect(g); g.connect(actx.destination);
    src.start(t);
  }catch(e){}
}
function quack(){ beep(330,170,0.09,'square',0.10,0); beep(290,150,0.10,'square',0.10,0.12); }
function jingle(){ var n=[523,659,784,1047]; for(var i=0;i<n.length;i++) beep(n[i],n[i],0.10,'square',0.10,i*0.085); }
function trombone(){ beep(196,196,0.15,'sawtooth',0.10,0); beep(165,165,0.15,'sawtooth',0.10,0.16); beep(147,140,0.34,'sawtooth',0.10,0.32); }
function fanfare(){ var n=[392,523,659,784]; for(var i=0;i<n.length;i++) beep(n[i],n[i],0.13,'square',0.11,i*0.11); }

/* ---------- state ---------- */
var state = 'title';           // title | intro | play | clear | gameover
var score = 0, round = 1, duckIdx = 0, hits = 0, bullets = 3;
var best = parseInt(localStorage.getItem('jp_duck_best') || '0', 10) || 0;
var ducks = [], feathers = [], flashes = [], clouds = [];
var mood = 'normal', moodT = 0, popT = 0;   // normal | happy | crying
var shotT = -1, shotAngle = 0, swingFrom = 0, swing = 0;   // shoot-swing: rifle swings to each shot, then settles
var shakeT = 0, freezeT = 0;   // screen shake on shoot, hit-stop freeze on hit
var banner = '', bannerT = 0;
var cross = { x: W/2, y: H/2 - 80 };
var introT = 0, resolveT = 0, clearT = 0;
var results = [];              // 'hit' | 'miss' per duck this round
var tufts = [];
var HIT_R = 40;

function quota(){ return Math.min(6 + Math.floor((round-1)/2), 8); }
function duckSpeed(){ return 150 + round * 38; }

for (var i = 0; i < 3; i++) clouds.push({ x: Math.random()*W, y: 40+Math.random()*120, s: 0.7+Math.random()*0.7 });
for (var j = 0; j < 46; j++) tufts.push({ x: Math.random()*W, h: 6+Math.random()*10 });

/* ---------- ducks ---------- */
function spawnDuck(){
  var dir = Math.random() < 0.5 ? 1 : -1;
  ducks.push({
    x: dir === 1 ? -60 : W + 60,
    y: 90 + Math.random()*250,
    vx: dir * duckSpeed() * (0.85 + Math.random()*0.3),
    baseVy: (Math.random()-0.5) * 70,
    dir: dir, flap: 0, flapT: 0, wob: Math.random()*6.28,
    state: 'fly', rot: 0, fallVy: 0, dead: false
  });
  bullets = 3;
  if (Math.random() < 0.6) quack();
}
function liveDuck(){
  for (var i = 0; i < ducks.length; i++) if (ducks[i].state === 'fly') return ducks[i];
  return null;
}
function setMood(m, t){
  mood = m; moodT = t; popT = 0.28;
}
var PRAISE = ['NICE SHOT!', 'PHIL APPROVES', 'BULLSEYE!', 'STRAIGHT UP PHILTHY'];
function hitDuck(d, sx, sy){
  d.state = 'fall'; d.fallVy = -140; d.rot = 0; freezeT = 0.06;
  var pts = 500 * round;
  score += pts;
  hits++; results.push('hit');
  setMood('happy', 1.5);
  banner = PRAISE[Math.floor(Math.random()*PRAISE.length)] + ' +' + pts;
  bannerT = 1.5;
  jingle();
  for (var i = 0; i < 14; i++) feathers.push({
    x: d.x, y: d.y, vx: (Math.random()-0.5)*260, vy: -Math.random()*220,
    life: 0.9, c: Math.random()<0.5 ? '#ffffff' : '#8a5a2b'
  });
  flashes.push({ x: sx, y: sy, t: 0.09 });
  resolveT = 1.6;   // wait for fall, then next duck
}
function missDuck(reason){
  results.push('miss');
  setMood('crying', 1.7);
  banner = reason === 'shells' ? 'OUT OF SHELLS!' : 'HE GOT AWAY...';
  bannerT = 1.7;
  trombone();
  var d = liveDuck();
  if (d && reason === 'shells'){ d.vx *= 1.7; }  // rub it in
  resolveT = 1.8;
}
function shoot(sx, sy){
  var d = liveDuck();
  if (!d || resolveT > 0) return;
  bullets--;
  bang();
  swingFrom = swing; shotAngle = aimTargetFor(sx, sy); shotT = 0;
  shakeT = 0.12;
  flashes.push({ x: sx, y: sy, t: 0.09 });
  var gt = gunTip(shotAngle);
  flashes.push({ x: gt.x, y: gt.y, t: 0.12 });
  var hit = null;
  for (var i = 0; i < ducks.length; i++){
    var q = ducks[i];
    if (q.state !== 'fly') continue;
    if (Math.hypot(q.x - sx, q.y - sy) < HIT_R){ hit = q; break; }
  }
  if (hit){ hitDuck(hit, sx, sy); }
  else if (bullets <= 0){ missDuck('shells'); }
  else {
    var near = false, j, q2;
    for (j = 0; j < ducks.length; j++){
      q2 = ducks[j];
      if (q2.state !== 'fly') continue;
      if (Math.hypot(q2.x - sx, q2.y - sy) < HIT_R*1.7){ near = true; break; }
    }
    if (near && bannerT <= 0){ banner = 'SO CLOSE!'; bannerT = 0.8; }
  }
}

/* ---------- flow ---------- */
function startGame(){
  score = 0; round = 1; duckIdx = 0; hits = 0;
  results = []; ducks = []; feathers = [];
  mood = 'normal'; moodT = 0; banner = '';
  state = 'intro'; introT = 2.0;
  fanfare();
}
function startRound(){
  duckIdx = 0; hits = 0; results = [];
  ducks = []; feathers = [];
  mood = 'normal'; moodT = 0;
  state = 'intro'; introT = 2.0;
  fanfare();
}
function nextDuckOrEnd(){
  duckIdx++;
  if (duckIdx >= 10){
    if (hits >= quota()){
      state = 'clear'; clearT = 2.2; banner = 'ROUND CLEAR!'; bannerT = 2.2; fanfare();
    } else {
      state = 'gameover';
      if (score > best){ best = score; localStorage.setItem('jp_duck_best', String(best)); }
      trombone();
    }
  } else {
    spawnDuck();
  }
}

/* ---------- update ---------- */
var lastT = 0;
function update(dt){
  var i, d;
  if (shotT >= 0){
    shotT += dt;
    var up = 0.11, down = 0.45;
    if (shotT < up){ var k1 = shotT/up, e1 = k1*k1*(3-2*k1); swing = swingFrom + (shotAngle - swingFrom)*e1; }
    else if (shotT < down){ var k2 = (shotT-up)/(down-up); swing = shotAngle * (1 - k2*k2*(3-2*k2)); }
    else { shotT = -1; swing = 0; }
  }
  for (i = 0; i < clouds.length; i++){
    clouds[i].x += 9 * dt;
    if (clouds[i].x > W + 120) clouds[i].x = -120;
  }
  for (i = feathers.length-1; i >= 0; i--){
    var f = feathers[i];
    f.vy += 500*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.life -= dt;
    if (f.life <= 0) feathers.splice(i,1);
  }
  for (i = flashes.length-1; i >= 0; i--){
    flashes[i].t -= dt;
    if (flashes[i].t <= 0) flashes.splice(i,1);
  }
  if (moodT > 0){ moodT -= dt; if (moodT <= 0) mood = 'normal'; }
  if (popT > 0) popT -= dt;
  if (bannerT > 0) bannerT -= dt;
  if (shakeT > 0) shakeT -= dt;

  if (state === 'intro'){
    introT -= dt;
    if (introT <= 0){ state = 'play'; spawnDuck(); }
    return;
  }
  if (state === 'clear'){
    clearT -= dt;
    if (clearT <= 0){ round++; startRound(); }
    return;
  }
  if (state !== 'play') return;

  if (resolveT > 0){
    resolveT -= dt;
    // let falling duck keep falling during resolve
    for (i = ducks.length-1; i >= 0; i--){
      d = ducks[i];
      if (d.state === 'fall'){
        d.fallVy += 1400*dt; d.y += d.fallVy*dt; d.rot += 9*dt;
        if (d.y > GRASS + 40){ ducks.splice(i,1); }
      }
    }
    if (resolveT <= 0) nextDuckOrEnd();
    return;
  }

  for (i = ducks.length-1; i >= 0; i--){
    d = ducks[i];
    if (d.state !== 'fly') continue;
    d.flapT += dt;
    if (d.flapT > 0.16){ d.flapT = 0; d.flap = 1 - d.flap; }
    d.wob += dt * 5;
    d.x += d.vx * dt;
    d.y += (d.baseVy + Math.sin(d.wob) * 55) * dt;
    if (d.y < 60){ d.y = 60; d.baseVy = Math.abs(d.baseVy); }
    if (d.y > GRASS - 70){ d.y = GRASS - 70; d.baseVy = -Math.abs(d.baseVy); }
    if (Math.abs(d.x - W/2) < 210 && d.y > 330){ d.y = 330; d.baseVy = -Math.abs(d.baseVy); }
    if ((d.dir === 1 && d.x > W + 70) || (d.dir === -1 && d.x < -70)){
      ducks.splice(i,1);
      missDuck('escaped');
    }
  }
}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r){
  cx.beginPath();
  cx.moveTo(x+r, y);
  cx.arcTo(x+w, y, x+w, y+h, r);
  cx.arcTo(x+w, y+h, x, y+h, r);
  cx.arcTo(x, y+h, x, y, r);
  cx.arcTo(x, y, x+w, y, r);
  cx.closePath();
}
function drawBackground(){
  var g = cx.createLinearGradient(0, 0, 0, GRASS);
  g.addColorStop(0, '#2fb9f5'); g.addColorStop(1, '#b8ecff');
  cx.fillStyle = g; cx.fillRect(0, 0, W, GRASS);
  cx.fillStyle = 'rgba(255,255,255,0.92)';
  for (var i = 0; i < clouds.length; i++){
    var c = clouds[i], s = c.s;
    cx.beginPath();
    cx.arc(c.x, c.y, 22*s, 0, 6.3); cx.arc(c.x+26*s, c.y-10*s, 26*s, 0, 6.3);
    cx.arc(c.x+56*s, c.y, 22*s, 0, 6.3); cx.arc(c.x+28*s, c.y+8*s, 24*s, 0, 6.3);
    cx.fill();
  }
  // tree
  cx.fillStyle = '#6b4423'; cx.fillRect(70, GRASS-150, 26, 150);
  cx.fillStyle = '#2e8b3a';
  cx.beginPath(); cx.arc(83, GRASS-170, 62, 0, 6.3); cx.arc(40, GRASS-140, 40, 0, 6.3); cx.arc(126, GRASS-140, 40, 0, 6.3); cx.fill();
  // bush
  cx.fillStyle = '#37a244';
  cx.beginPath(); cx.arc(830, GRASS-18, 46, 3.14, 0); cx.arc(880, GRASS-14, 34, 3.14, 0); cx.fill();
  // grass
  cx.fillStyle = '#58b72e'; cx.fillRect(0, GRASS, W, H-GRASS);
  cx.fillStyle = '#4a9c24'; cx.fillRect(0, GRASS, W, 10);
  cx.strokeStyle = '#3f8a1f'; cx.lineWidth = 3;
  for (var i = 0; i < tufts.length; i++){
    var t = tufts[i], x = t.x;
    cx.beginPath();
    cx.moveTo(x, GRASS+46); cx.lineTo(x-5, GRASS+46-t.h); cx.moveTo(x, GRASS+46); cx.lineTo(x+5, GRASS+46-t.h*0.8);
    cx.stroke();
  }
}
function drawDuck(d){
  cx.save();
  cx.translate(d.x, d.y);
  if (d.state === 'fall') cx.rotate(d.rot);
  cx.scale(2.4 * d.dir, 2.4);
  // tail
  cx.fillStyle = '#5e3a17';
  cx.beginPath(); cx.moveTo(-14,-3); cx.lineTo(-24,-11); cx.lineTo(-22,3); cx.closePath(); cx.fill();
  // body
  cx.fillStyle = '#8a5a2b'; rr(-16,-9,32,18,6); cx.fill();
  // wing
  cx.fillStyle = '#5e3a17';
  if (d.flap === 0) { rr(-11,-24,20,13,4); cx.fill(); }
  else { rr(-11,1,20,13,4); cx.fill(); }
  // head
  cx.fillStyle = '#2fa14f';
  cx.beginPath(); cx.arc(14,-12,9,0,6.3); cx.fill();
  // beak
  cx.fillStyle = '#ffcf3f';
  cx.beginPath(); cx.moveTo(21,-14); cx.lineTo(29,-11); cx.lineTo(21,-8); cx.closePath(); cx.fill();
  // eye
  if (d.state === 'fall'){
    cx.strokeStyle = '#10240f'; cx.lineWidth = 2;
    cx.beginPath();
    cx.moveTo(11,-17); cx.lineTo(17,-11); cx.moveTo(17,-17); cx.lineTo(11,-11);
    cx.stroke();
  } else {
    cx.fillStyle = '#fff'; cx.fillRect(14,-17,5,5);
    cx.fillStyle = '#000'; cx.fillRect(16,-15,2,2);
  }
  cx.restore();
}
function aimTargetFor(px, py){
  var haX = W/2 - 96, haY = H - 190;   // his hands, approx
  var ad = Math.atan2(py - haY, px - haX) - Math.PI;
  while (ad > Math.PI) ad -= Math.PI*2;
  while (ad < -Math.PI) ad += Math.PI*2;
  return Math.max(-0.45, Math.min(0.45, ad));
}
function gunTip(a){
  var s = 300, x = W/2 - s/2, y = H - s - 4;
  var pvx = x + s*0.42, pvy = y + s*0.88;
  var tx = x + s*0.06, ty = y + s*0.335;
  var c = Math.cos(a), n = Math.sin(a);
  return { x: pvx + (tx-pvx)*c - (ty-pvy)*n, y: pvy + (tx-pvx)*n + (ty-pvy)*c };
}
function drawPhil(){
  var s = 300, pop = popT > 0 ? 1 + 0.12*(popT/0.28) : 1;
  s *= pop;
  var x = W/2 - s/2, y = H - s - 4;
  cx.fillStyle = 'rgba(0,0,0,0.30)';
  cx.beginPath(); cx.ellipse(W/2, H - 26, s*0.34, 20, 0, 0, 6.3); cx.fill();
  var pvx = x + s*0.42, pvy = y + s*0.88;
  cx.save();
  cx.translate(pvx, pvy); cx.rotate(swing);
  if (shotT >= 0){
    var rk = Math.min(1, shotT/0.06), decay = Math.exp(-Math.max(0, shotT-0.06)*8);
    var kick = 13*Math.sin(rk*Math.PI/2)*decay, shk = 3*rk*decay*Math.sin(shotT*95);
    cx.translate(shk, kick);
  }
  cx.translate(-pvx, -pvy);
  if (imgHunter.width){
    cx.shadowColor = 'rgba(0,0,0,0.25)'; cx.shadowBlur = 14; cx.shadowOffsetY = 4;
    cx.drawImage(mood === 'happy' && imgHappy.width ? imgHappy : mood === 'crying' && imgCry.width ? imgCry : imgHunter, x, y, s, s);
  }
  var t = performance.now()/1000, u = s/300;
  function fgx(px){ return x + (px/1000)*s; }
  function fgy(py){ return y + (py/1000)*s; }
  if (mood === 'crying' && imgCry.width){
    var eyes = [[555,257],[454,266]], e, k;
    cx.save();
    cx.lineCap = 'round';
    for (e = 0; e < 2; e++){
      var ex = fgx(eyes[e][0]), ey = fgy(eyes[e][1]);
      for (k = 0; k < 3; k++){
        var ph = (t*0.9 + k*0.37 + e*0.2) % 1;
        var dx = ex + (k-1)*4*u, dy = ey + 6*u + ph*92*u;
        cx.globalAlpha = 1 - ph*0.55;
        cx.fillStyle = '#3f9dff';
        cx.beginPath(); cx.arc(dx, dy+4*u, 6.5*u, 0, 6.3); cx.fill();
        cx.beginPath(); cx.moveTo(dx-6.5*u, dy+4*u); cx.lineTo(dx, dy-9*u); cx.lineTo(dx+6.5*u, dy+4*u); cx.closePath(); cx.fill();
        cx.fillStyle = 'rgba(255,255,255,0.75)';
        cx.fillRect(dx-3.5*u, dy-2*u, 3*u, 6*u);
      }
    }
    cx.restore();
  }
  cx.restore();
  cx.font = 'bold 17px "Courier New",monospace'; cx.textAlign = 'center';
  cx.lineWidth = 4; cx.strokeStyle = '#000';
  var label = mood === 'happy' ? 'JEAN PHIL: THRILLED' : mood === 'crying' ? 'JEAN PHIL: DEVASTATED' : 'JEAN PHIL';
  cx.strokeText(label, W/2, H - 14);
  cx.fillStyle = mood === 'happy' ? '#3ddc84' : mood === 'crying' ? '#6db7ff' : '#fff';
  cx.fillText(label, W/2, H - 14);
}
function drawGun(){
  // first-person NES zapper peeking from bottom-right
  cx.save();
  cx.translate(W-120, H-40); cx.rotate(-0.5);
  cx.fillStyle = '#c33'; rr(-14,-16,28,64,6); cx.fill();
  cx.fillStyle = '#888'; rr(-8,-64,16,52,5); cx.fill();
  cx.fillStyle = '#333'; cx.fillRect(-8,-64,16,10);
  cx.restore();
}
function drawCrosshair(){
  var x = cross.x, y = cross.y;
  cx.save();
  cx.strokeStyle = '#ff2222'; cx.lineWidth = 3;
  cx.beginPath(); cx.arc(x, y, 16, 0, 6.3); cx.stroke();
  cx.strokeStyle = '#fff'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.arc(x, y, 16, 0, 6.3); cx.stroke();
  cx.strokeStyle = '#ff2222'; cx.lineWidth = 3;
  cx.beginPath();
  cx.moveTo(x-26,y); cx.lineTo(x-8,y); cx.moveTo(x+8,y); cx.lineTo(x+26,y);
  cx.moveTo(x,y-26); cx.lineTo(x,y-8); cx.moveTo(x,y+8); cx.lineTo(x,y+26);
  cx.stroke();
  cx.restore();
}
function drawHUD(){
  cx.textAlign = 'left'; cx.font = 'bold 22px "Courier New",monospace';
  cx.lineWidth = 4; cx.strokeStyle = '#000';
  cx.strokeText('SCORE ' + score, 16, 32); cx.fillStyle = '#fff'; cx.fillText('SCORE ' + score, 16, 32);
  cx.textAlign = 'center';
  cx.strokeText('ROUND ' + round, W/2, 32); cx.fillStyle = '#ffe45c'; cx.fillText('ROUND ' + round, W/2, 32);
  // duck strip
  for (var i = 0; i < 10; i++){
    cx.fillStyle = '#000'; cx.fillRect(W-248+i*22, 14, 18, 16);
    cx.fillStyle = i < results.length ? (results[i]==='hit' ? '#3ddc84' : '#ff5c5c') : '#5a6b7d';
    cx.fillRect(W-246+i*22, 16, 14, 12);
  }
  // bullets
  cx.textAlign = 'left';
  cx.strokeText('SHELLS', 16, 62); cx.fillStyle = '#fff'; cx.fillText('SHELLS', 16, 62);
  for (var b = 0; b < 3; b++){
    cx.fillStyle = b < bullets ? '#ffcf3f' : '#3a3f4a';
    rr(110 + b*26, 46, 18, 22, 4); cx.fill();
  }
  cx.textAlign = 'center';
  cx.strokeText('NEED ' + quota(), W/2, 62); cx.fillStyle = '#ffe45c'; cx.fillText('NEED ' + quota(), W/2, 62);
}
function drawBanner(){
  if (bannerT <= 0 || !banner) return;
  cx.font = 'bold 46px "Courier New",monospace'; cx.textAlign = 'center';
  cx.lineWidth = 8; cx.strokeStyle = '#000';
  cx.strokeText(banner, W/2, 200);
  cx.fillStyle = '#ffe45c'; cx.fillText(banner, W/2, 200);
}
function drawFeathers(){
  for (var i = 0; i < feathers.length; i++){
    var f = feathers[i];
    cx.globalAlpha = Math.max(0, f.life);
    cx.fillStyle = f.c;
    cx.fillRect(f.x-3, f.y-3, 6, 6);
  }
  cx.globalAlpha = 1;
}
function drawFlashes(){
  for (var i = 0; i < flashes.length; i++){
    var f = flashes[i], r = 26 * (f.t/0.09) + 8;
    cx.save();
    cx.globalAlpha = Math.max(0, f.t/0.09);
    cx.strokeStyle = '#ffdd33'; cx.lineWidth = 5;
    cx.beginPath();
    for (var k = 0; k < 8; k++){
      var a = k * Math.PI/4;
      cx.moveTo(f.x + Math.cos(a)*r*0.4, f.y + Math.sin(a)*r*0.4);
      cx.lineTo(f.x + Math.cos(a)*r, f.y + Math.sin(a)*r);
    }
    cx.stroke();
    cx.restore();
  }
}
function overlay(alpha){
  cx.fillStyle = 'rgba(4,8,20,' + alpha + ')';
  cx.fillRect(0, 0, W, H);
}
function bigText(txt, y, size, color){
  cx.font = 'bold ' + size + 'px "Courier New",monospace'; cx.textAlign = 'center';
  cx.lineWidth = Math.max(4, size/8); cx.strokeStyle = '#000';
  cx.strokeText(txt, W/2, y);
  cx.fillStyle = color || '#fff'; cx.fillText(txt, W/2, y);
}
function draw(){
  cx.save();
  if (shakeT > 0){ var sm = shakeT/0.12; cx.translate((Math.random()-0.5)*6*sm, (Math.random()-0.5)*6*sm); }
  var i;
  for (i = 0; i < ducks.length; i++) drawDuck(ducks[i]);
  drawFeathers();
  if (state !== 'title') drawPhil();
  if (state === 'play'){ drawCrosshair(); drawHUD(); }
  drawFlashes();
  drawBanner();

  if (state === 'title'){
    overlay(0.55);
    bigText("JEAN PHIL'S", 105, 64, '#ffe45c');
    bigText('DUCK HUNT', 170, 64, '#3ddc84');
    if (imgHunter.width) cx.drawImage(imgHunter, W/2-125, 195, 250, 250);
    bigText('ducks are flying. jean phil is watching.', 478, 20, '#fff');
    bigText('aim with mouse / finger - click or tap to shoot', 504, 20, '#fff');
    bigText('3 shells per duck - hit ' + quota() + ' of 10 to advance', 530, 20, '#fff');
    if (best > 0) bigText('BEST ' + best, 556, 22, '#ffe45c');
    if (Math.floor(performance.now()/500) % 2 === 0) bigText('CLICK TO START', 586, 26, '#ffe45c');
  }
  if (state === 'intro'){
    overlay(0.45);
    bigText('ROUND ' + round, 260, 72, '#ffe45c');
    bigText('HIT ' + quota() + ' OF 10 DUCKS', 330, 30, '#fff');
  }
  if (state === 'clear'){
    overlay(0.45);
    bigText('ROUND CLEAR!', 280, 64, '#3ddc84');
  }
  if (state === 'gameover'){
    overlay(0.6);
    bigText('GAME OVER', 200, 72, '#ff5c5c');
    bigText('SCORE ' + score, 290, 36, '#fff');
    bigText('BEST ' + best, 340, 28, '#ffe45c');
    if (imgCry.width) cx.drawImage(imgCry, W/2-75, 370, 150, 150);
    if (Math.floor(performance.now()/500) % 2 === 0) bigText('CLICK TO PLAY AGAIN', 570, 28, '#ffe45c');
  }
  cx.restore();
}

/* ---------- input ---------- */
function toGame(e){
  var r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top) * (H / r.height)
  };
}
cv.addEventListener('pointermove', function(e){
  var p = toGame(e);
  cross.x = Math.max(0, Math.min(W, p.x));
  cross.y = Math.max(0, Math.min(H, p.y));
});
cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  AC();
  var p = toGame(e);
  cross.x = Math.max(0, Math.min(W, p.x));
  cross.y = Math.max(0, Math.min(H, p.y));
  if (state === 'title'){ startGame(); return; }
  if (state === 'gameover'){ startGame(); return; }
  if (state === 'play'){ shoot(cross.x, cross.y); }
});
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.getElementById('mute').addEventListener('click', function(){
  muted = !muted;
  this.innerHTML = muted ? '&#128263;' : '&#128266;';
});

/* ---------- main loop ---------- */
function frame(t){
  var dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  if (freezeT > 0){ freezeT -= dt; } else { update(dt); }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* test hook (harmless in production) */
window.__duck = {
  get state(){ return state; }, get score(){ return score; },
  get mood(){ return mood; }, get round(){ return round; },
  get hits(){ return hits; }, get bullets(){ return bullets; },
  get duckIdx(){ return duckIdx; },
  get aim(){ return swing; }, get banner(){ return banner; }, get shake(){ return shakeT; },
  duck: function(){
    var d = liveDuck();
    return d ? { x: d.x, y: d.y, state: d.state } : null;
  }
};
})();
